[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-experience-blueprints"
version = "0.1.0.dev0"
description = "Provider-neutral contracts for responsive agent experiences."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Agent Experience Blueprints contributors" }]
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "mypy>=1.15,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = { agent_core = "packages/agent_core/agent_core", agent_api = "apps/api/agent_api" }
packages = ["agent_core", "agent_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_core", "agent_api"]
