[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-experience-blueprints"
version = "0.1.0.dev0"
description = "Provider-neutral contracts for responsive agent experiences."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Agent Experience Blueprints contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = { "" = "packages/agent_core" }

[tool.setuptools.packages.find]
where = ["packages/agent_core"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_core"]
